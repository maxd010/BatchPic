<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BatchPic - 图片交付准备工具</title>
    <script>
      // Prevent default drag-and-drop behavior immediately on page load
      // This must be done before React mounts to catch all drag events
      (function() {
        const preventDefaults = function(e) {
          e.preventDefault();
          e.stopPropagation();
        };
        
        // CRITICAL: Use capture phase (true) to ensure these handlers run BEFORE
        // any bubble-phase handlers in React components
        // This prevents the odd/even behavior where handlers conflict
        window.addEventListener('dragover', preventDefaults, true);
        window.addEventListener('drop', preventDefaults, true);
        window.addEventListener('dragenter', preventDefaults, true);
        window.addEventListener('dragleave', preventDefaults, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
